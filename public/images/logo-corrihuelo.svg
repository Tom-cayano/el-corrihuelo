    <path d="M40 0 C40 25, 60 40, 80 40 C60 40, 40 55, 40 80 C40 55, 20 40, 0 40 C20 40, 40 25, 40 0 Z" fill="currentColor"/>
  </g>

  <!-- Typography -->
