<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <style>
      .text-primary { font-family: 'Playfair Display', serif; font-size: 64px; font-weight: 700; fill: currentColor; }
      .text-secondary { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 400; letter-spacing: 6px; fill: currentColor; opacity: 0.7; }
    </style>
  </defs>
  
  <!-- Icon: Elegant minimal leaf/arch -->
